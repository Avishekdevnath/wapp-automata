<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="telcia-rim" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006a4e"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#004d38"/>
    </linearGradient>
    <filter id="crimson-glow" x="2" y="2" width="20" height="20" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Emerald Gradient Outer Border -->
  <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="6" fill="url(#telcia-rim)"/>

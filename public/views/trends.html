        <!-- ============================================== -->
        <!-- VIEW 2: MARKET TRENDS (Chart.js Analytics)     -->
        <!-- ============================================== -->
        <div id="view-trends" class="space-y-6 hidden">
          
          <!-- KPI Summary Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="glass-card rounded-2xl p-5 border border-dark-700/80">
              <span class="text-xs text-slate-400 font-medium block mb-1">Average Market Rate</span>
              <span id="trends-kpi-avg" class="text-xl font-bold font-mono text-emerald-400 block">--</span>
              <span class="text-[10px] text-slate-500">Based on recent vendor quotes</span>
            </div>
            <div class="glass-card rounded-2xl p-5 border border-dark-700/80">
              <span class="text-xs text-slate-400 font-medium block mb-1">Lowest Historical Dip</span>
              <span id="trends-kpi-lowest" class="text-xl font-bold font-mono text-blue-400 block">--</span>
              <span class="text-[10px] text-slate-500">Cheapest quote observed</span>
            </div>
            <div class="glass-card rounded-2xl p-5 border border-dark-700/80">
              <span class="text-xs text-slate-400 font-medium block mb-1">Total Market Quotes</span>
              <span id="trends-kpi-count" class="text-xl font-bold font-mono text-purple-400 block">--</span>
              <span class="text-[10px] text-slate-500">Logged price ticks</span>
            </div>
          </div>

          <!-- Interactive Chart Box -->
          <div class="glass-card rounded-2xl p-6 border border-dark-700/80 space-y-4 shadow-xl">
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <div>
                <h3 class="text-sm font-bold text-white">Route Price Trajectory ($/min)</h3>
                <p class="text-xs text-slate-400">Tracks price compression, stability, and market spreads</p>
              </div>

              <!-- Period Toggle & Country Selector -->
              <div class="flex items-center gap-2">
                <select id="trends-country-select" onchange="handleTrendsCountryChange(event)" class="bg-dark-900 border border-dark-700 rounded-xl px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-emerald-500">
                  <option value="">All Destinations</option>
                </select>

                <div class="flex items-center p-1 rounded-xl bg-dark-900 border border-dark-700 text-xs">
                  <button id="btn-period-7" onclick="handleTrendsPeriodChange(7)" class="btn-trends-period px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all">7D</button>
                  <button id="btn-period-30" onclick="handleTrendsPeriodChange(30)" class="btn-trends-period px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-medium transition-all">30D</button>
                  <button id="btn-period-90" onclick="handleTrendsPeriodChange(90)" class="btn-trends-period px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all">90D</button>
                  <button id="btn-period-365" onclick="handleTrendsPeriodChange(365)" class="btn-trends-period px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all">1Y</button>
                </div>
              </div>
            </div>

            <!-- Canvas Container -->
            <div class="w-full h-80 relative">
              <canvas id="trends-chart-canvas"></canvas>
            </div>
          </div>

        </div>

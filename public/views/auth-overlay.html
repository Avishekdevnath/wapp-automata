  <!-- ========================================== -->
  <!-- 1. AUTHENTICATION GATE (Password Overlay)  -->
  <!-- ========================================== -->
  <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark-950/95 backdrop-blur-xl">
    <div class="glass-card max-w-md w-full rounded-3xl p-8 border border-dark-700 shadow-2xl space-y-6 text-center">
      
      <!-- Icon & Branding -->
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 p-[1px] mx-auto shadow-xl shadow-emerald-500/20">
        <div class="w-full h-full bg-dark-950 rounded-[15px] flex items-center justify-center">
          <i data-lucide="shield-lock" class="w-8 h-8 text-emerald-400"></i>
        </div>
      </div>

      <div class="space-y-1">
        <h2 class="text-xl font-bold text-white tracking-tight">Telecom Trading Terminal</h2>
        <p class="text-xs text-slate-400">Enter your access password to unlock live route feeds, market trends & vendor intelligence.</p>
      </div>

      <form onsubmit="handleLoginSubmit(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Terminal Access Password</label>
          <div class="relative">
            <i data-lucide="key-round" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input 
              type="password" 
              id="auth-password" 
              placeholder="Enter password (default: wapp2026)" 
              required
              class="w-full bg-dark-900 border border-dark-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors"
            />
          </div>
        </div>

        <!-- Keep Logged In Option -->
        <div class="flex items-center justify-between text-xs text-slate-400 py-0.5">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input 
              type="checkbox" 
              id="auth-remember" 
              checked 
              class="w-4 h-4 rounded border-dark-700 bg-dark-900 text-emerald-500 focus:ring-emerald-500/20 accent-emerald-500 cursor-pointer"
            />
            <span class="text-slate-300 font-medium text-xs">Stay logged in</span>
          </label>
          <span class="text-[11px] text-slate-500">Persistent across reloads</span>
        </div>

        <p id="auth-error-msg" class="text-xs text-rose-400 font-medium hidden text-center"></p>

        <button type="submit" id="btn-login" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs shadow-lg shadow-emerald-600/25 transition-all flex items-center justify-center gap-2">
          <span>Unlock Terminal</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <p class="text-[11px] text-slate-500">End-to-End Encrypted Gateway • Hostinger KVM 2</p>
    </div>
  </div>

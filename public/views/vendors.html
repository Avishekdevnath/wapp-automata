<!-- VIEW 5: VENDOR DIRECTORY -->
<div id="view-vendors" class="space-y-4 hidden">
  <!-- Top Search & Filter Toolbar Card -->
  <div class="glass-card rounded-2xl p-4 border border-dark-700/80 space-y-3 shadow-sm">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4 text-purple-400"></i>
          <span>Carriers & Account Managers Directory</span>
        </h3>
        <p class="text-xs text-slate-400">Direct WhatsApp wholesale carriers, interconnect partners, and suppliers.</p>
      </div>
      <div class="flex items-center gap-2">
        <button 
          onclick="loadVendorDirectory()" 
          class="px-3 py-1.5 rounded-xl bg-dark-900 hover:bg-dark-800 border border-dark-700 hover:border-slate-500 text-slate-300 text-xs font-medium flex items-center gap-1.5 transition-all shadow-sm"
          title="Refresh Carrier List"
        >
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-purple-400"></i>
          <span>Refresh</span>
        </button>
      </div>
    </div>

    <!-- Search & Filter Controls Grid -->
    <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 pt-1 border-t border-dark-800">
      <!-- Search Input -->
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="vendor-search-input" 
          oninput="handleVendorSearch(event)" 
          placeholder="Search carrier name, contact, phone (+1800...), or company..." 
          class="w-full pl-9 pr-4 py-2 bg-dark-950 border border-dark-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500"
        />
      </div>

      <!-- Activity Filter & Sort Controls -->
      <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
        <!-- Filter Activity -->
        <select 
          id="vendor-filter-activity" 
          onchange="handleVendorFilter()" 
          class="bg-dark-950 border border-dark-800 text-xs text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-purple-500"
        >
          <option value="all">All Activity Levels</option>
          <option value="high">High Volume (5+ Offers)</option>
          <option value="standard">Standard (1–4 Offers)</option>
        </select>

        <!-- Sort Order -->
        <select 
          id="vendor-sort-by" 
          onchange="handleVendorFilter()" 
          class="bg-dark-950 border border-dark-800 text-xs text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-purple-500"
        >
          <option value="offers_desc">Most Active (Offers ↓)</option>
          <option value="recent">Recently Seen ↓</option>
          <option value="name_asc">Carrier Name (A → Z)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Carriers Table Card -->
  <div class="glass-card rounded-2xl border border-dark-700/80 overflow-hidden shadow-sm">
    <div class="px-5 py-3 border-b border-dark-700/80 flex items-center justify-between bg-dark-900/40">
      <span class="font-bold text-xs text-white">Carriers & Account Managers</span>
      <span class="text-[11px] text-slate-500">Direct WhatsApp Contacts</span>
    </div>
    <div class="overflow-x-auto overflow-y-auto max-h-[640px]">
      <table class="w-full text-left border-collapse">
        <thead class="sticky top-0 z-10 border-b border-dark-700">
          <tr class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider bg-dark-900/90">
            <th class="py-3 px-4 bg-slate-100 dark:bg-dark-900">Contact</th>
            <th class="py-3 px-4 bg-slate-100 dark:bg-dark-900">Company</th>
            <th class="py-3 px-4 bg-slate-100 dark:bg-dark-900">Activity Volume</th>
            <th class="py-3 px-4 bg-slate-100 dark:bg-dark-900">Last Seen</th>
            <th class="py-3 px-4 text-right bg-slate-100 dark:bg-dark-900">Direct Outreach</th>
          </tr>
        </thead>
        <tbody id="vendors-tbody" class="divide-y divide-dark-800/60 text-xs">
          <!-- Injected via vendor-dir.js -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- VENDORS PAGINATION TOOLBAR -->
  <div id="vendor-pagination-bar" class="glass-card rounded-2xl p-4 border border-dark-700/80 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs shadow-lg">
    <!-- Left: Showing Count -->
    <div class="flex items-center gap-2 text-slate-400">
      <span id="vendor-page-info">Showing <strong id="vendor-page-start" class="text-white">1</strong> to <strong id="vendor-page-end" class="text-white">10</strong> of <strong id="vendor-page-total" class="text-purple-400 font-bold">0</strong> carriers</span>
    </div>

    <!-- Middle: Rows Per Page Selector -->
    <div class="flex items-center gap-2">
      <span class="text-slate-400 text-[11px]">Carriers per page:</span>
      <div class="inline-flex items-center p-0.5 rounded-xl bg-dark-900 border border-dark-700">
        <button onclick="setVendorPageSize(10)" data-size="10" class="btn-vendor-size px-2.5 py-1 rounded-lg bg-purple-600 text-white font-semibold transition-all font-mono">10</button>
        <button onclick="setVendorPageSize(25)" data-size="25" class="btn-vendor-size px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all font-mono">25</button>
        <button onclick="setVendorPageSize(50)" data-size="50" class="btn-vendor-size px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all font-mono">50</button>
        <button onclick="setVendorPageSize(0)" data-size="0" class="btn-vendor-size px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all font-mono">All</button>
      </div>
    </div>

    <!-- Right: Page Navigation -->
    <div class="flex items-center gap-2">
      <button onclick="changeVendorPage(-1)" id="btn-vendor-prev" class="px-3 py-1.5 rounded-xl bg-dark-900 border border-dark-700 hover:border-slate-500 text-slate-300 disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1 transition-all">
        <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
        <span>Previous</span>
      </button>
      <div class="px-3 py-1.5 rounded-xl bg-dark-950 border border-dark-800 font-mono text-[11px] text-slate-300">
        Page <span id="vendor-current-page" class="text-purple-400 font-bold">1</span> of <span id="vendor-total-pages" class="text-slate-400">1</span>
      </div>
      <button onclick="changeVendorPage(1)" id="btn-vendor-next" class="px-3 py-1.5 rounded-xl bg-dark-900 border border-dark-700 hover:border-slate-500 text-slate-300 disabled:opacity-40 disabled:pointer-events-none flex items-center gap-1 transition-all">
        <span>Next</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </div>
</div>

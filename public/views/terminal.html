<!-- VIEW 6: LIVE WHATSAPP MESSAGE STREAM (Zero-Loss) -->
<div id="view-terminal" class="space-y-4 hidden">
  <!-- Top Stream Header & Metrics Card -->
  <div class="glass-card rounded-2xl p-4 sm:p-5 border border-dark-700/80 shadow-xl space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="space-y-1">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <h3 class="text-base font-bold text-white tracking-tight">Live WhatsApp Message Stream</h3>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Zero-Loss Stream</span>
        </div>
        <p class="text-xs text-slate-400">Continuous 24/7 capture of all incoming group broadcasts, rate sheets, and carrier DMs.</p>
      </div>

      <!-- Action Controls -->
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="toggleStreamAutoScroll()" id="btn-stream-autoscroll" class="px-3 py-1.5 rounded-xl bg-dark-900 border border-dark-700 text-xs text-emerald-400 hover:text-white flex items-center gap-1.5 transition-all">
          <i data-lucide="chevrons-down" class="w-3.5 h-3.5"></i>
          <span id="label-stream-autoscroll">Auto-Scroll: ON</span>
        </button>
        <button onclick="exportMessagesJson()" class="px-3 py-1.5 rounded-xl bg-dark-900 border border-dark-700 text-xs text-slate-300 hover:text-white flex items-center gap-1.5 transition-all">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Export JSON</span>
        </button>
        <button onclick="exportMessagesCsv()" class="px-3 py-1.5 rounded-xl bg-dark-900 border border-dark-700 text-xs text-slate-300 hover:text-white flex items-center gap-1.5 transition-all">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
          <span>Export CSV</span>
        </button>
      </div>
    </div>

    <!-- Real-time Counters Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1 border-t border-dark-800">
      <div class="p-3 rounded-xl bg-dark-950/80 border border-dark-800">
        <span class="text-[11px] text-slate-400 block">Total Messages Captured</span>
        <span id="stat-total-streamed" class="text-lg font-mono font-bold text-white">0</span>
      </div>
      <div class="p-3 rounded-xl bg-dark-950/80 border border-dark-800">
        <span class="text-[11px] text-slate-400 block">Active Groups Monitored</span>
        <span id="stat-groups-streamed" class="text-lg font-mono font-bold text-sky-400">0</span>
      </div>
      <div class="p-3 rounded-xl bg-dark-950/80 border border-dark-800">
        <span class="text-[11px] text-slate-400 block">Unique Carriers / Senders</span>
        <span id="stat-senders-streamed" class="text-lg font-mono font-bold text-purple-400">0</span>
      </div>
      <div class="p-3 rounded-xl bg-dark-950/80 border border-dark-800">
        <span class="text-[11px] text-slate-400 block">Stream Heartbeat</span>
        <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1 mt-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Active (Polling 3.5s)</span>
        </span>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-1">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="client-search-input" 
          oninput="renderClientFeed()" 
          placeholder="Filter stream by vendor phone, contact name, group subject, or message text..." 
          class="w-full pl-9 pr-4 py-2 bg-dark-950 border border-dark-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500"
        />
      </div>
      <div class="flex items-center gap-2">
        <select id="client-filter-type" onchange="renderClientFeed()" class="bg-dark-950 border border-dark-800 text-xs text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-emerald-500">
          <option value="all">All Messages (Groups + DMs)</option>
          <option value="group">Groups Only</option>
          <option value="direct">Direct Messages Only</option>
          <option value="media">With Media / Images Only</option>
        </select>
        <button onclick="renderClientFeed()" class="p-2 rounded-xl bg-dark-900 border border-dark-700 text-slate-300 hover:text-white" title="Refresh Feed">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Live Messages Feed Container -->
  <div id="client-messages-container" class="space-y-3">
    <!-- Dynamically injected via client-inbox.js -->
  </div>
</div>

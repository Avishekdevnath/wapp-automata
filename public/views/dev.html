<!-- VIEW 7: DEVELOPER STUDIO -->
<div id="view-dev" class="space-y-6 hidden">
  <!-- Simulation Box -->
  <div class="glass-card rounded-2xl p-6 border border-dark-700/80 space-y-4 shadow-xl">
    <h3 class="text-sm font-bold text-white flex items-center gap-2">
      <i data-lucide="flask-conical" class="w-4 h-4 text-sky-400"></i>
      <span>Simulate Inbound Telecom Message</span>
    </h3>
    <p class="text-xs text-slate-400">Simulate a real carrier WhatsApp rate post to test the real-time extraction pipeline.</p>
    <form onsubmit="handleSimulationSubmit(event)" class="space-y-3">
      <div>
        <textarea 
          id="sim-text" 
          rows="4" 
          placeholder="Paste telecom message (e.g. Colombia CC CLI 1/1 at $0.0055)..." 
          required
          class="w-full bg-dark-900 border border-dark-700 rounded-xl p-3 text-xs text-white font-mono placeholder-slate-500 focus:outline-none focus:border-sky-500"
        ></textarea>
      </div>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <input type="text" id="sim-sender-phone" placeholder="Sender Phone (+123456789)" class="bg-dark-900 border border-dark-700 rounded-xl px-3 py-1.5 text-xs text-white" />
          <input type="text" id="sim-sender-name" placeholder="Sender Name (HANI)" class="bg-dark-900 border border-dark-700 rounded-xl px-3 py-1.5 text-xs text-white" />
        </div>
        <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs flex items-center gap-2 transition-all">
          <i data-lucide="play" class="w-3.5 h-3.5"></i>
          <span>Test Ingest</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WappAutomata • Wholesale Telecom Trading Terminal</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js for Historical Trends -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- QRCode.js for In-Browser QR Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Custom Styling -->
  <link rel="stylesheet" href="/css/dashboard.css?v=38">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            dark: {
              950: '#060911',
              900: '#0c1220',
              850: '#11192d',
              800: '#18243c',
              700: '#233352',
            }
          }
        }
      }
    }
  </script>
  <!-- Instant Session Restoration (Prevents login flicker on reload) -->
  <style>
    html, body {
      height: 100%;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    html.is-authenticated #auth-overlay { display: none !important; }
    html.is-authenticated #main-app { display: flex !important; height: 100vh !important; max-height: 100vh !important; overflow: hidden !important; }
  </style>
  <script>
    (function() {
      try {
        var token = localStorage.getItem('wapp_token') || sessionStorage.getItem('wapp_token');
        if (token) {
          document.documentElement.classList.add('is-authenticated');
        }
        var theme = localStorage.getItem('wapp_theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="h-screen h-[100dvh] overflow-hidden bg-dark-950 text-slate-100 flex flex-col font-sans selection:bg-emerald-500 selection:text-white">

  <!-- 1. AUTHENTICATION GATE (Password Overlay) -->
  <!-- @include views/auth-overlay.html -->

    <!-- RESPONSIVE SIDEBAR -->
    <!-- @include views/sidebar.html -->

    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-dark-900/40">
      
      <!-- TOP HEADER -->
      <!-- @include views/header.html -->

      <!-- SCROLLABLE PAGE CONTENT AREA -->
      <main class="flex-1 overflow-y-auto w-full p-4 sm:p-6 lg:p-8" id="main-content-scroll">
        <div class="max-w-7xl mx-auto space-y-6">

          <!-- VIEW 1: ROUTE MATRIX -->
          <!-- @include views/routes.html -->

          <!-- VIEW 2: MARKET TRENDS & CHARTS -->
          <!-- @include views/trends.html -->

          <!-- VIEW 3: AI INSIGHTS & ARBITRAGE SIGNALS -->
          <!-- @include views/insights.html -->

          <!-- VIEW 4: TELCO NEWS & OUTAGES -->
          <!-- @include views/news.html -->

          <!-- VIEW 5: VENDOR DIRECTORY -->
          <!-- @include views/vendors.html -->

          <!-- VIEW 6: LIVE WHATSAPP MESSAGE STREAM (Zero-Loss) -->

          <!-- VIEW 7: SYSTEM PIPELINE & AI INSPECTOR -->
          <!-- @include views/pipeline.html -->

          <!-- VIEW 8: DEVELOPER STUDIO -->
          <!-- @include views/dev.html -->

        </div>
      </main>

    </div>
  </div>

  <!-- 3. MODALS (WhatsApp Device, Storage, Routes, Toast) -->
  <!-- @include views/modals.html -->

  <!-- Modular Scripts -->
  <script src="/js/auth.js?v=38"></script>
  <script src="/js/app.js?v=38"></script>
  <script src="/js/window-manager.js?v=38"></script>
  <script src="/js/route-matrix.js?v=38"></script>
  <script src="/js/market-trends.js?v=38"></script>
  <script src="/js/ai-insights.js?v=38"></script>

  <script src="/js/storage-manager.js?v=38"></script>
  <script src="/js/simulator.js?v=38"></script>
  <script src="/js/ai-settings.js?v=38"></script>
</body>
</html>
